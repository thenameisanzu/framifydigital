<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="iconNavyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a4d" />
      <stop offset="70%" stop-color="#081033" />
      <stop offset="100%" stop-color="#04081c" />
    </radialGradient>
  </defs>

  <!-- Dark Navy Outer Circular Disc with transparent background -->
  <circle cx="100" cy="100" r="96" fill="url(#iconNavyGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- White Inner Circle -->
  <circle cx="100" cy="100" r="56" fill="#ffffff" />

  <!-- 4-node perspective frame with connecting lines -->
  <line x1="78" y1="87" x2="122" y2="91" stroke="#081033" stroke-width="5.5" stroke-linecap="round" />
  <line x1="122" y1="91" x2="122" y2="115" stroke="#081033" stroke-width="5.5" stroke-linecap="round" />
  <line x1="122" y1="115" x2="78" y2="110" stroke="#081033" stroke-width="5.5" stroke-linecap="round" />
  <line x1="78" y1="110" x2="78" y2="87" stroke="#081033" stroke-width="5.5" stroke-linecap="round" />

  <!-- 4 Nodes -->
  <circle cx="78" cy="87" r="7.5" fill="#081033" />
  <circle cx="122" cy="91" r="7.5" fill="#081033" />
  <circle cx="122" cy="115" r="7.5" fill="#081033" />
  <circle cx="78" cy="110" r="7.5" fill="#081033" />
</svg>
