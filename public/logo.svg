<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="navyDiscGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a4d" />
      <stop offset="60%" stop-color="#081033" />
      <stop offset="100%" stop-color="#04081c" />
    </radialGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00d2ff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Dark Navy Circular Disc with Transparent Outer Background -->
  <circle cx="250" cy="250" r="236" fill="url(#navyDiscGrad)" filter="url(#subtleGlow)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Content Group centered -->
  <g transform="translate(100, 185)">
    <!-- White Circle Icon -->
    <circle cx="65" cy="65" r="65" fill="#ffffff" />
    
    <!-- 4-node frame with connecting lines -->
    <!-- Top line -->
    <line x1="40" y1="50" x2="90" y2="55" stroke="#081033" stroke-width="6.5" stroke-linecap="round" />
    <!-- Right line -->
    <line x1="90" y1="55" x2="90" y2="82" stroke="#081033" stroke-width="6.5" stroke-linecap="round" />
    <!-- Bottom line -->
    <line x1="90" y1="82" x2="40" y2="76" stroke="#081033" stroke-width="6.5" stroke-linecap="round" />
    <!-- Left line -->
    <line x1="40" y1="76" x2="40" y2="50" stroke="#081033" stroke-width="6.5" stroke-linecap="round" />

    <!-- 4 Nodes (Circles) -->
    <circle cx="40" cy="50" r="8.5" fill="#081033" />
    <circle cx="90" cy="55" r="8.5" fill="#081033" />
    <circle cx="90" cy="82" r="8.5" fill="#081033" />
    <circle cx="40" cy="76" r="8.5" fill="#081033" />

    <!-- Typography Framify -->
    <text x="145" y="86" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5">Framify</text>
  </g>
</svg>
